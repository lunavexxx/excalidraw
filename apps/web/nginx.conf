# SPA 回退:/login /signup 等前端路由由 index.html 接管;
# Caddy 在其前层做 /api 反代与 TLS,这里只管静态资源。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带哈希的构建产物可长缓存;index.html 不缓存以保证发版即生效
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
